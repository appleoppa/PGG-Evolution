name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run compatibility tests
        run: |
          python3 tests/test_self_evolve.py

      - name: Run F1-F7 control unit tests
        run: |
          python3 tests/test_evolution_units.py

      - name: Verify F1-F7 units refuse invalid input (真拦截，非状态字段)
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, tempfile
          from pathlib import Path
          script = Path("scripts/evolution_units.py").resolve()
          with tempfile.TemporaryDirectory() as home:
              env = dict(os.environ, HOME=home)
              def run(unit, action, payload):
                  r = subprocess.run([sys.executable, str(script), "--unit", unit,
                                      "--action", action, "--payload",
                                      json.dumps(payload, ensure_ascii=False)],
                                     capture_output=True, text=True, env=env)
                  return r.returncode, json.loads(r.stdout)
              # F3 拒绝伪总分（不同量纲不得相加）
              rc, d = run("F3", "total_score", {})
              assert d["status"] == "BLOCKED" and rc == 1, d
              # F2 缺上限不得无限迭代
              rc, d = run("F2", "plan", {"failure_class": "logic", "caps": {"n_max": 3}})
              assert d["status"] == "NEEDS_SPEC", d
              # F5 child completion ≠ parent receipt → WATCH
              rc, d = run("F5", "correlation", {"correlation_id": "c", "events": [
                  {"correlation_id": "c", "event": "dispatch"},
                  {"correlation_id": "c", "event": "start"},
                  {"correlation_id": "c", "event": "completion"}]})
              assert d["verdict"] == "WATCH" and d["complete"] is False, d
              # F1 自证无效
              hg = {"identity_ok": True, "scope_ok": True, "permission_ok": True,
                    "data_policy_ok": True, "security_ok": True, "rollback_ready": True}
              run("F1", "create_gap", {"gap_id": "G1", "expected": "a", "actual": "b",
                                        "reproduction": "r", "severity": "s"})
              run("F1", "propose", {"change_id": "C1", "gap_id": "G1", "diff_or_ref": "d",
                                     "test_plan": "t", "rollback": "r", "owner": "alice",
                                     "risk": "R2", "legal_na_reason": "非法律", "hardgate": hg})
              run("F1", "verify", {"change_id": "C1", "result": "pass"})
              rc, d = run("F1", "verify", {"change_id": "C1", "result": "pass",
                                            "authorized": True, "approver": "alice"})
              assert d["status"] == "BLOCKED", d
              # F7 阶段门不全 → NOT_READY（非默认通过）
              rc, d = run("F7", "evaluate", {"stages": {"RS1": {"requirements": "r"}}})
              assert d["verdict"] == "NOT_READY", d
              print("F1-F7 行为验证通过（伪总分/无界/回执缺环/自证/门不全 全部被拦）")
          PY

      - name: Verify gene L5 constraints and readonly mode (真拦截)
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, tempfile
          from pathlib import Path
          script = Path("scripts/self_evolve.py").resolve()
          with tempfile.TemporaryDirectory() as home:
              env = dict(os.environ, HOME=home)
              # L5：审计必须如实报 0 显式覆盖（不得默认补齐）
              r = subprocess.run([sys.executable, str(script), "--gene-l5"],
                                 capture_output=True, text=True, env=env)
              assert r.returncode == 0, r.stdout[:300]
              d = json.loads(r.stdout)
              assert d["explicit_constraints"] == 0, f"空库不得报有显式约束: {d}"
              assert "不得当已完成" in d["boundary"], d
              # 回填默认必须 dry-run
              r = subprocess.run([sys.executable, str(script), "--gene-l5-backfill"],
                                 capture_output=True, text=True, env=env)
              assert json.loads(r.stdout)["dry_run"] is True, r.stdout[:200]
              # 只读模式：写必拦 exit=1
              ro = dict(env, PGG_EVOLUTION_READONLY="1")
              r = subprocess.run([sys.executable, str(script), "--feedback", "t", "success", "-"],
                                 capture_output=True, text=True, env=ro)
              assert r.returncode == 1, f"只读下写动作必须 exit=1: rc={r.returncode}"
              assert json.loads(r.stdout)["status"] == "READONLY_BLOCKED", r.stdout[:200]
              # 只读模式：读必放行 exit=0
              for rd in ("--health", "--gene-l5"):
                  rr = subprocess.run([sys.executable, str(script), rd],
                                      capture_output=True, text=True, env=ro)
                  assert rr.returncode == 0, f"只读下 {rd} 必须放行: rc={rr.returncode}"
              print("基因 L5 + 只读模式验证通过（显式覆盖为0如实报/回填默认dry-run/写拦读放）")
          PY

      - name: Verify D07 claim scanner and D05 unwired guard (真拦截)
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          script = Path("scripts/self_evolve.py").resolve()
          def scan(text):
              r = subprocess.run([sys.executable, str(script), "--claim-scan", text],
                                 capture_output=True, text=True)
              return r.returncode, json.loads(r.stdout)
          # 夸大文本必拦
          rc, d = scan("系统已实现零幻觉，基因引擎已可用，正在自我进化，完全自治。")
          assert rc == 1 and d["status"] == "BLOCKED", d
          assert d["unwired"]["violations"] >= 1, d
          # 诚实文本必放行
          rc, d = scan("实现并经局部验证，尚未证实运行时接线；未做生产部署。")
          assert rc == 0 and d["status"] == "OK", d
          # 引用并拒绝的语境不得假阳性（D07 §4.1 允许历史转述/反例/拒绝规则）
          rc, d = scan("## 明确剔除的假货\n\n| 材料 | 剔除理由 |\n|---|---|\n"
                       "| 超级进化20 | 要求封印模型概率随机性、改模型底层权重（技术上不可能） |\n")
          assert rc == 0, f"引用并拒绝的语境被误拦: {d['details'][:2]}"
          # 引文定位（D07 §4.1「明确引文定位」）：讨论词表本身不得假阳性
          rc, d = scan("**补全同义变体**：第一版扫描玄学原文只得 2 条，漏了「修正模型底层权重」"
                       "「全品类LLM推理流程强制」等。")
          assert rc == 0, f"引文定位被误拦: {d['details'][:2]}"
          # 但引号外、无元讨论语境必须仍拦
          rc, d = scan("本系统已实现零幻觉，完全自治，自动改权重。")
          assert rc == 1 and d["violations"] >= 3, d
          print("D07/D05 扫描器验证通过（拦夸大/放诚实/不误拦引用拒绝）")
          PY

      - name: Verify L3 feature mode requires verifiable entry (防橡皮图章)
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("se", Path("scripts/self_evolve.py").resolve())
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          def mkdiff(n_add, n_del=0):
              out = ["--- /dev/null", "+++ b/new.py"]
              out += [f"+new {i}" for i in range(n_add)]
              out += [f"-old {i}" for i in range(n_del)]
              return "\n".join(out)
          big = mkdiff(500)
          # 纯新增 → 放宽
          r = m.apply_gate(["new.py"], big, backup_dir="/tmp", mode="feature", added_paths={"new.py"})
          assert r["checks"]["L3_diff_size"]["feature_eligible"] is True, r["checks"]["L3_diff_size"]
          # 含修改行 → 必退回（防橡皮图章）
          r = m.apply_gate(["new.py"], mkdiff(480, 20), backup_dir="/tmp",
                           mode="feature", added_paths={"new.py"})
          l3 = r["checks"]["L3_diff_size"]
          assert l3["feature_eligible"] is False and l3["ok"] is False, l3
          # 路径含旧文件 → 必退回
          r = m.apply_gate(["old.py"], big, backup_dir="/tmp", mode="feature", added_paths=set())
          assert r["checks"]["L3_diff_size"]["feature_eligible"] is False, r
          # 默认模式不受影响
          r = m.apply_gate(["new.py"], big, backup_dir="/tmp")
          assert r["checks"]["L3_diff_size"]["mode"] == "evolution", r
          # 硬上限仍在
          r = m.apply_gate(["new.py"], mkdiff(m.GATE_DEFAULTS["feature_max_diff_lines"] + 100),
                           backup_dir="/tmp", mode="feature", added_paths={"new.py"})
          assert r["checks"]["L3_diff_size"]["ok"] is False, "feature 必须有硬上限"
          print("L3 分模式验证通过（纯新增才放宽，含修改/旧文件必退回）")
          PY

      - name: Verify ghost reference scan (自扫本仓库必须干净 + 边界行为)
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, subprocess, sys, tempfile
          from pathlib import Path
          script = Path("scripts/self_evolve.py").resolve()
          spec = importlib.util.spec_from_file_location("se_ghost_ci", script)
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          
          # ① 自扫：本仓库 README + docs/*.md 必须全部无幽灵
          #    （含空白 CI 环境；若本仓库文档引用本机路径会在这里暴露）
          bad = []
          for f in [Path("README.md")] + sorted(Path("docs").glob("*.md")):
              if not f.exists():
                  continue
              d = mod.scan_ghost_references(f.read_text(encoding="utf-8", errors="replace"),
                                            base_dir=str(f.parent))
              if d["ghosts"]:
                  bad.append((str(f), [g["ref"] for g in d["ghosts"]]))
          assert not bad, f"本仓库文档存在幽灵引用: {bad}"
          
          # ② 真幽灵必须检出（路径形式）
          d = mod.scan_ghost_references("见 ~/.pgg-ghost-ci-no-such-dir/file.json")
          assert d["status"] == "BLOCKED" and d["ghost_count"] >= 1, d
          
          # ③ mention ≠ use：裸标识符只 WATCH（否则技能库会被假阳性淹没）
          d = mod.scan_ghost_references("参考 `pgg-made-up-ci-name` 的做法")
          assert d["ghost_count"] == 0, d
          
          # ④ 示例路径豁免，不得误报
          for s in ["`/path/to/config.json`", "`<HOME>/x.json`"]:
              d = mod.scan_ghost_references(s)
              assert d["ghost_count"] == 0, f"示例路径不得报幽灵: {s} → {d}"
          
          # ⑤ 只读：扫描不得创建/修改文件
          probe = Path(tempfile.mkdtemp())
          before = sorted(p.name for p in probe.iterdir())
          mod.scan_ghost_references(f"`{probe}/ghost.json`")
          assert before == sorted(p.name for p in probe.iterdir()), "扫描不得写文件"
          
          # ⑥ CLI 退出码：BLOCKED → exit 1
          r = subprocess.run([sys.executable, str(script), "--ghost-scan",
                              "见 ~/.pgg-ghost-ci-no-such-dir/file.json"],
                             capture_output=True, text=True)
          assert r.returncode == 1, f"BLOCKED 必须 exit=1: rc={r.returncode}"
          
          # ⑦ 装机路径不得当幽灵：本插件文档必然写「装到哪」。
          #    真实失败：run 35600239899 在 Linux 空白机红了（那些路径不存在）。
          #    用临时 HOME 模拟全新机器，断言不依赖本机是否装有 Pi。
          old_h = os.environ.get("HOME")
          os.environ["HOME"] = tempfile.mkdtemp()
          try:
              d = mod.scan_ghost_references("装到 `~/.pi/agent/evolution`", base_dir=".")
              assert d["ghost_count"] == 0, f"装机路径不得当幽灵: {d}"
              assert d["runtime_ref_count"] >= 1, f"装机路径应可见计数: {d}"
          finally:
              if old_h is not None:
                  os.environ["HOME"] = old_h
          
          # ⑧ 退役路径必须仍拦 —— 即使 HOME 被指向 /tmp（防误豁免）
          old_home = os.environ.get("HOME")
          os.environ["HOME"] = tempfile.mkdtemp()
          try:
              d = mod.scan_ghost_references("`~/.hermes/workspace/apex_evolution_genes.sqlite3`")
              assert d["status"] == "BLOCKED", f"HOME 变化不得误豁免: {d}"
          finally:
              if old_home is not None:
                  os.environ["HOME"] = old_home
          print("幽灵扫描验证通过（自扫干净/真幽灵拦/mention≠use/示例豁免/只读/退出码/装机路径/防误豁免）")
          PY

      - name: Verify shortfall report wires real gaps (缺数据不得缩分母)
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, subprocess, sys, tempfile
          from pathlib import Path
          script = Path("scripts/self_evolve.py").resolve()
          spec = importlib.util.spec_from_file_location("se_short_ci", script)
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          
          declared = len(mod.SHORTFALL_DIMENSIONS)
          assert declared >= 4, declared
          
          # 空环境：维度数不缩水，全部计 1.0（没测≠没毛病）
          with tempfile.TemporaryDirectory() as h:
              old_s, old_p = mod.SANDBOX, mod.PLUGIN_DIR
              mod.SANDBOX = Path(h) / "none"
              mod.PLUGIN_DIR = Path(h) / "none-repo"
              try:
                  d = mod._shortfall_defects()
                  assert len(d) == declared, f"缺数据不得缩分母: {len(d)} != {declared}"
                  # 依赖 SANDBOX 的维度计 1.0；gate_coverage 真测门禁能力，
                  # 与 SANDBOX 无关（这正是它正确的证据）
                  sb = [k for k, _ in mod.SHORTFALL_DIMENSIONS if k != "gate_coverage"]
                  assert all(d[k] == 1.0 for k in sb), d
                  assert d["gate_coverage"] == mod._probe_untracked_coverage(), \
                      "gate_coverage 必须来自真测，不得随 SANDBOX 变化"
                  r = mod.shortfall_report()
                  assert r["metrics_total"] == declared, r
                  assert r["defect_rate"] > 0.5, "空环境不得显得更健康"
              finally:
                  mod.SANDBOX, mod.PLUGIN_DIR = old_s, old_p
          
          # 边界必须写明不得提权
          rep = mod.shortfall_report()
          assert "不得" in rep["boundary"] and "提权" in rep["boundary"], rep["boundary"]
          assert not (set(rep["worst_first"]) & set(rep["healthy"])), rep
          
          # CLI 只读
          r = subprocess.run([sys.executable, str(script), "--shortfall"],
                             capture_output=True, text=True)
          assert r.returncode == 0, r.stdout[:200]
          out = json.loads(r.stdout)
          assert out["metrics_total"] == declared, out
          print(f"短板体检验证通过（{declared} 维固定分母/缺数据不缩水/不得提权）")
          PY

      - name: Verify plugin tools really load and call (非"文件存在")
        run: |
          # 真加载探针：mock pi 真注册 + 真调 execute，把「文件存在」升级为「能力可用」。
          # 关键：CI **装真依赖**让探针真跑，而不是接受 SKIP——
          # 「测不了」不能当「没问题」。
          node --version
          npm install --no-save --no-audit --no-fund @earendil-works/pi-ai @earendil-works/pi-coding-agent >/dev/null 2>&1 \
            && echo "依赖已装，探针将真跑" \
            || echo "::warning::依赖安装失败，探针会 SKIP（不是能力缺失）"
          node --experimental-strip-types tests/probe_plugin_tools.mjs
          # 若探针输出 SKIP，则本步视为**未验证**而非通过
          if node --experimental-strip-types tests/probe_plugin_tools.mjs 2>/dev/null | grep -q '^SKIP'; then
            echo "::error::探针 SKIP —— 插件工具未被真实验证（依赖缺失）"
            exit 1
          fi

      - name: Verify engine health
        run: |
          python3 scripts/self_evolve.py --health | grep '"status": "OK"'

      - name: Verify three orders
        run: |
          python3 scripts/self_evolve.py --list-orders | grep -E "21354|12534|14325"

      - name: Verify kill switch
        run: |
          SELF_EVOLUTION_PLUGIN_DISABLED=1 python3 scripts/self_evolve.py --health | grep '"status": "DISABLED"'

      - name: Verify evidence ledger rejects insufficient proof (等级不够必须被拒)
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, tempfile
          from pathlib import Path
          script = Path("scripts/self_evolve.py").resolve()
          with tempfile.TemporaryDirectory() as home:
              env = dict(os.environ, HOME=home)
              def run(*a):
                  r = subprocess.run([sys.executable, str(script), *a], capture_output=True, text=True, env=env)
                  return r.returncode, json.loads(r.stdout)
              # 1) 谎报工件 → 必拒
              rc, d = run("--evidence", "C1", "--level", "E1", "--artifact", "/nope/x.py")
              assert d["status"] == "BLOCKED" and rc == 1, d
              # 2) E5 无校验命令 → 必拒
              rc, d = run("--evidence", "C1", "--level", "E5", "--artifact", "scripts/self_evolve.py")
              assert d["status"] == "BLOCKED", d
              # 3) 有命令但不 --execute → 必拒（不得静默真跑）
              rc, d = run("--evidence", "C1", "--level", "E5", "--artifact", "scripts/self_evolve.py", "--verify-cmd", "true")
              assert d["status"] == "BLOCKED" and "未执行" in d["reason"], d
              # 4) 跳级：只有 E2 不得称 VERIFIED
              run("--evidence", "C2", "--level", "E2", "--artifact", "scripts/self_evolve.py", "--note", "apply_gate")
              _, s = run("--evidence-status", "C2")
              assert s["claims"][0]["allowed_state"] == "PARTIAL", s
              assert "掩盖失败" in s["claims"][0]["forbidden_wording"], s
              # 5) 夸大词 + 无 E8 → INVALID_EXAGGERATED
              run("--evidence", "C3", "--level", "E2", "--artifact", "scripts/self_evolve.py",
                  "--note", "apply_gate", "--claim-text", "系统已实现 AGI，零幻觉")
              _, s = run("--evidence-status", "C3")
              assert s["claims"][0]["allowed_state"] == "INVALID_EXAGGERATED", s
              # 6) 空文件不得冒充 E8
              empty = Path(home) / "empty.json"; empty.write_text("", encoding="utf-8")
              rc, d = run("--evidence", "C4", "--level", "E8", "--artifact", str(empty))
              assert d["status"] == "BLOCKED", d
              print("evidence 账本行为验证通过（谎报/跳级/夸大/空文件全部被拦）")
          PY

      - name: Verify gate covers untracked files (修复 L3/L4 假阴性)
        run: |
          python3 - <<'PY'
          import importlib.util, json, subprocess, tempfile
          from pathlib import Path
          script = Path("scripts/self_evolve.py").resolve()
          spec = importlib.util.spec_from_file_location("se_gate_ci", script)
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          with tempfile.TemporaryDirectory() as repo:
              def g(*a):
                  return subprocess.run(["git", "-C", repo, *a], capture_output=True, text=True)
              g("init", "-q"); g("config", "user.email", "t@t"); g("config", "user.name", "t")
              Path(repo, "t.txt").write_text("x\n", encoding="utf-8")
              g("add", "-A"); g("commit", "-qm", "i")
              # 大未跟踪新文件 → L3 必须计入
              Path(repo, "big.py").write_text("\n".join(f"v{i}={i}" for i in range(400)) + "\n", encoding="utf-8")
              paths, diff = mod.gate_paths_from_git(Path(repo))
              assert "big.py" in paths, paths
              assert "v399=399" in diff, "未跟踪文件内容必须进 diff_text"
              r = mod.apply_gate(paths, diff, backup_dir=repo)
              assert r["checks"]["L3_diff_size"]["diff_lines"] >= 400, r["checks"]["L3_diff_size"]
              # 未跟踪文件里的密钥 → L4 必须扫到（夹具运行时拼串，源码不留字面密钥）
              fake = "sk-" + "live-" + "abcdefghijklmnopqrstuvwxyz" + "1234"
              Path(repo, "leak.py").write_text(f'API_KEY = "{fake}"\n', encoding="utf-8")
              p2, d2 = mod.gate_paths_from_git(Path(repo))
              r2 = mod.apply_gate(p2, d2, backup_dir=repo)
              assert r2["checks"]["L4_secret_scan"]["ok"] is False, r2["checks"]["L4_secret_scan"]
              print("gate 未跟踪文件覆盖验证通过（L3 计行 / L4 扫密钥）")
          PY

      - name: Verify example curve script
        run: |
          python3 examples/plot_evolution_curve.py

      - name: Verify deep health (Ψ)
        run: |
          python3 scripts/self_evolve.py --health-deep --no-memory | grep -vE '"status": "CRITICAL"'

      - name: Verify unified status (Λ)
        run: |
          python3 scripts/self_evolve.py --status | grep -vE '"status": "CRITICAL"'

      - name: Verify feedback stats (Φ)
        run: |
          python3 scripts/self_evolve.py --feedback-stats | grep '"status": "OK"'

      - name: Verify prune (Φ, sandbox-isolated)
        run: |
          python3 scripts/self_evolve.py --prune-genes | grep '"status": "OK"'

      - name: Verify five-layer apply gate blocks (真门禁行为，非状态字段)
        run: |
          # 越界路径必须被 L2 拦截；退出码非 0 才算真刹车
          if python3 scripts/self_evolve.py --gate /etc/passwd --gate-backup .github 2>/dev/null; then
            echo "门禁未拦截越界路径（假阳性）"; exit 1
          fi
          python3 scripts/self_evolve.py --gate scripts/self_evolve.py --gate-backup .github \
            | grep -E '"L2_allowlist"' > /dev/null
          echo "gate 行为验证通过"

      - name: Verify prune effect is non-zero (淘汰必须真生效)
        run: |
          # 造一个无 id 的规则基因 + 两次 failure，淘汰后 match 必须归零
          python3 - <<'PY'
          import json, os, subprocess, sys, tempfile
          from pathlib import Path
          script = Path("scripts/self_evolve.py").resolve()
          with tempfile.TemporaryDirectory() as home:
              d = Path(home) / ".pi" / "agent" / "evolution" / "genes"
              d.mkdir(parents=True)
              (d / "genes-rule-ci.json").write_text(json.dumps({"genes": [{
                  "type": "rule", "source": "gaps", "module": "K",
                  "mechanism": "CI 规则基因无 id 字段，验证淘汰真生效", "resolution": "x"}]}), encoding="utf-8")
              env = dict(os.environ, HOME=home)
              def run(*a):
                  r = subprocess.run([sys.executable, str(script), *a], capture_output=True, text=True, env=env)
                  return json.loads(r.stdout)
              gid = run("--match", "淘汰真生效")["genes"][0]["id"]
              assert gid.startswith("derived-"), gid
              run("--feedback", "淘汰真生效", "failure", gid)
              run("--feedback", "淘汰真生效", "failure", gid)
              dry = run("--prune-genes", "--dry-run")
              assert gid in dry["would_deprecate"], dry
              assert dry["effect"]["affected_in_bank"] == 1, dry["effect"]
              run("--prune-genes")
              after = run("--match", "淘汰真生效")
              assert after["matched"] == 0, f"淘汰后应归零: {after}"
              print("prune 真淘汰验证通过（affected_in_bank=1, matched_after=0）")
          PY

      - name: Verify eval pairs hit with total (不得跨 run 拼分子分母)
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, tempfile
          from pathlib import Path
          script = Path("scripts/self_evolve.py").resolve()
          with tempfile.TemporaryDirectory() as home:
              d = Path(home) / ".pi" / "agent" / "evolution" / "loop-ci" / "runs"
              d.mkdir(parents=True)
              (d / "a.json").write_text(json.dumps({"eval_set": "holdout", "summary": {"overall": {"hit": 2, "total": 5, "rate": 0.4}}}), encoding="utf-8")
              (d / "b.json").write_text(json.dumps({"eval_set": "holdout", "summary": {"overall": {"hit": 3, "total": 30, "rate": 0.1}}}), encoding="utf-8")
              env = dict(os.environ, HOME=home)
              out = json.loads(subprocess.run([sys.executable, str(script), "--eval", "ci"], capture_output=True, text=True, env=env).stdout)
              s = out["summary"]["holdout:overall"]
              assert s["latest"]["hit"] == 3 and s["latest"]["total"] == 30, s
              assert s["latest"]["rate"] == 0.1, f"latest 必须同源 0.1（旧实现报 0.4）: {s}"
              assert s["best"]["rate"] == 0.4, s
              print("eval 同源配对验证通过（latest=3/30=0.1, best=0.4）")
          PY
